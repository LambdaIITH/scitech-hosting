# Every SciTech club site, served by one nginx server: <name>.iith.dev comes from /srv/sites/<name>/current,
# which update-sites keeps up to date. The Cloudflare tunnel sends each site's public hostname to 127.0.0.1:8100.
# install.sh copies this file to /etc/nginx/conf.d/scitech.conf (it belongs in nginx's http block).
#
# Headers are picked by the maps below so that every add_header can sit in the server block: in nginx, a location
# that sets any header silently drops all the headers set above it.

# The club feeds (/api/events.json, /api/projects.json) are read by other sites from the browser.
map $uri $scitech_cors {
    ~^/api/  "*";
    default  "";
}

map $uri $scitech_cache {
    ~^/_astro/  "public, max-age=31536000, immutable"; # Astro names these files after their content
    default     "public, max-age=0, must-revalidate";   # as on Netlify: a new build shows up at once
}

# Who may show a site inside a frame. Glitch was built to follow stricter rules, so it gets them.
map $host $scitech_csp {
    glitch.iith.dev  "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
    default          "frame-ancestors 'self'";
}

# Old addresses that moved, as "<host><path>" -> new path.
map $host$uri $scitech_redirect {
    glitch.iith.dev/leaderboard   /scoreboard/;
    glitch.iith.dev/leaderboard/  /scoreboard/;
    default                       "";
}

# A name the tunnel shouldn't send here gets nothing.
server {
    listen 127.0.0.1:8100 default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:8100;
    server_name ~^(?<site>[a-z0-9-]+)\.iith\.dev$;

    root /srv/sites/$site/current;
    index index.html;
    error_page 404 /404.html;

    server_tokens off;
    absolute_redirect off; # behind the tunnel, redirect to /events/ rather than http://127.0.0.1:8100/events/

    gzip on;
    gzip_vary on;
    gzip_proxied any; # every request arrives through the tunnel
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    # "always" adds them to error pages too; an empty value (from a map) sends no header
    add_header Content-Security-Policy $scitech_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin $scitech_cors always;
    add_header Cache-Control $scitech_cache always;

    if ($scitech_redirect) {
        return 301 $scitech_redirect;
    }

    # Netlify and Cloudflare Pages control files: nothing to serve
    location ~ /_(headers|redirects)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
