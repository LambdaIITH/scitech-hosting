# The shared build for SciTech sites. Each site's own workflow calls it in a few lines (see README.md). It builds
# the site and, for a push to the site's main branch, publishes the result to that repo's `deploy` branch, which
# the server pulls (update-sites). Pull requests only get the build, as a check.
name: Build a SciTech site

on:
  workflow_call:
    inputs:
      url:
        description: The site's address, e.g. https://aero.iith.dev/
        type: string
        required: true
      hugo:
        description: Hugo version for a Hugo site, e.g. 0.87.0 (the extended edition is used)
        type: string
        default: ""
      node:
        description: Node version for a site with npm packages (runs npm ci first)
        type: string
        default: ""
      command:
        description: Build command. For a Hugo site, --baseURL is set to the site's address.
        type: string
        default: hugo --minify --gc
      output:
        description: Folder the build writes the finished site to
        type: string
        default: public

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to push the built site to the deploy branch
    concurrency:
      group: build-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.run_id || 'publish' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - if: inputs.node != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node }}
          cache: npm
      - if: inputs.node != ''
        run: npm ci

      - name: Install Hugo ${{ inputs.hugo }}
        if: inputs.hugo != ''
        env:
          V: ${{ inputs.hugo }}
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v$V"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/hugo_${V}_checksums.txt"
          # the download's name changed in Hugo 0.103.0
          for f in "hugo_extended_${V}_linux-amd64.tar.gz" "hugo_extended_${V}_Linux-64bit.tar.gz"; do
            grep -q " $f\$" "$RUNNER_TEMP/checksums.txt" && break
          done
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$f" "$base/$f"
          grep " $f\$" checksums.txt | sha256sum -c --quiet -
          mkdir hugo && tar -xzf "$f" -C hugo hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build
        env:
          COMMAND: ${{ inputs.command }}
          OUTPUT: ${{ inputs.output }}
          URL: ${{ inputs.url }}
          HUGO: ${{ inputs.hugo }}
          HUGO_ENV: production
        run: |
          if [ -n "$HUGO" ]; then bash -c "$COMMAND --baseURL \"\$URL\""; else bash -c "$COMMAND"; fi
          test -f "$OUTPUT/index.html" || { echo "::error::The build made no $OUTPUT/index.html"; exit 1; }

      - name: Publish to the deploy branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: ${{ inputs.output }}
        run: |
          cd "$OUTPUT"
          git init -q -b deploy
          git add -A
          git -c user.name="scitech-deploy" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
