name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nginx if the runner has none
        run: command -v nginx || { sudo apt-get update -q && sudo apt-get install -y -q nginx-core; }
      - run: bash -n update-sites && bash -n install.sh
      - run: python3 -m unittest discover -s tests -v
        env:
          REQUIRE_NGINX: "1"
